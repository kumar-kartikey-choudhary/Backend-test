spring.application.name=PRATIK-DAIRY-CART

server.port = 8085

spring.datasource.driver-class-name = org.mariadb.jdbc.Driver
spring.datasource.url = jdbc:mariadb://localhost:3306/pratik_dairy_cart?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = root
spring.datasource.password = 123456

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

# jwt.secret comes from pratik-dairy-core's shared.properties (bundled in the core jar) -
# see that file to change it for every service at once, or set env var JWT_SECRET.
spring.config.import=classpath:shared.properties

product.url=http://localhost:8082

#Eureka configuration
eureka.instance.prefer-ip-address = true

# Local development: register with Eureka under the loopback address so the gateway keeps reaching the
# services when the Wi-Fi / hotspot address changes (otherwise they stay registered under a dead address
# and every call fails with "No route to host"). On a real deployment set EUREKA_INSTANCE_IP to the
# address other services can reach this one on, or remove this line.
eureka.instance.ip-address=${EUREKA_INSTANCE_IP:127.0.0.1}
eureka.client.fetch-registry = true
eureka.client.register-with-eureka = true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
