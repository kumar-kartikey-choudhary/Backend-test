spring.application.name=PRATIK-DAIRY-PRODUCT



spring.datasource.driver-class-name = org.mariadb.jdbc.Driver
spring.datasource.url = jdbc:mariadb://localhost:3306/pratik_dairy_product?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = root
spring.datasource.password = 123456
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

server.port = 8082

springdoc.swagger-ui.path = /docs

# jwt.secret comes from pratik-dairy-core's shared.properties (bundled in the core jar) -
# see that file to change it for every service at once, or set env var JWT_SECRET.
spring.config.import=classpath:shared.properties
product.url = http://localhost:8082

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

management.endpoints.web.exposure.include=health,info
management.endpoints.health,show-details=never


#Eureka configuration
eureka.instance.prefer-ip-address = true

# Local development: register with Eureka under the loopback address so the gateway keeps reaching the
# services when the Wi-Fi / hotspot address changes (otherwise they stay registered under a dead address
# and every call fails with "No route to host"). On a real deployment set EUREKA_INSTANCE_IP to the
# address other services can reach this one on, or remove this line.
eureka.instance.ip-address=${EUREKA_INSTANCE_IP:127.0.0.1}
eureka.client.fetch-registry = true
eureka.client.register-with-eureka = true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------- Service-to-service key --------
# Calls to another service's /internal/ endpoints must carry this shared key (see
# InternalApiKeyFilter in pratik-dairy-core). It is read from the INTERNAL_API_KEY environment
# variable (or internal.api-key); the built-in default is for local development only, so set a
# long random value, identical in every service, wherever this is deployed.
