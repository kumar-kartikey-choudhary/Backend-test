spring.application.name=PRATIK-DAIRY-ORDER


spring.datasource.driver-class-name = org.mariadb.jdbc.Driver
spring.datasource.url = jdbc:mariadb://localhost:3306/pratik_dairy_order?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = root
spring.datasource.password = 123456
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

server.port = 8083
product.url=http://localhost:8082
cart.url=http://localhost:8085
payment.url=http://localhost:8084
spring.cloud.openfeign.okhttp.enabled=true

# jwt.secret comes from pratik-dairy-core's shared.properties (bundled in the core jar) -
# see that file to change it for every service at once, or set env var JWT_SECRET.
spring.config.import=classpath:shared.properties

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true


#Eureka configuration
eureka.instance.prefer-ip-address = true

# Local development: register with Eureka under the loopback address so the gateway keeps reaching the
# services when the Wi-Fi / hotspot address changes (otherwise they stay registered under a dead address
# and every call fails with "No route to host"). On a real deployment set EUREKA_INSTANCE_IP to the
# address other services can reach this one on, or remove this line.
eureka.instance.ip-address=${EUREKA_INSTANCE_IP:127.0.0.1}
eureka.client.fetch-registry = true
eureka.client.register-with-eureka = true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Circuit breaker
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s
resilience4j.timelimiter.instances.productService.timeout-duration=3s

# -------- Service-to-service key --------
# Calls to another service's /internal/ endpoints must carry this shared key (see
# InternalApiKeyFilter in pratik-dairy-core). It is read from the INTERNAL_API_KEY environment
# variable (or internal.api-key); the built-in default is for local development only, so set a
# long random value, identical in every service, wherever this is deployed.


# -------- Unpaid orders --------
# Checkout reserves stock straight away. An order that is never paid for (and isn't cash on delivery) is
# cancelled by a background sweep once it is this old with no recent payment activity, so its stock goes
# back on the shelf. The sweep runs every scan-interval-ms.
order.unpaid-expiry-minutes=30
order.expiry-scan-interval-ms=300000
