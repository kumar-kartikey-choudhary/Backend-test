spring.application.name=PRATIK-DAIRY-USER

spring.datasource.driver-class-name = org.mariadb.jdbc.Driver
spring.datasource.url = jdbc:mariadb://localhost:3306/pratik_dairy_user?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = root
spring.datasource.password = 123456
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

server.port = 8081

user.url = http://localhost:8081/users

management.endpoints.web.exposure.include=health,info
management.endpoints.health,show-details=never

springdoc.swagger-ui.path = /user-docs

# JWT Configuration
# SECRET: production mein ise env variable se set karo
#   Windows:  set JWT_SECRET=<your-64-char-random-string>
#   Linux/Mac: export JWT_SECRET=<your-64-char-random-string>
# EXPIRATION: 3600000 = 1 hour (milliseconds)


# ${JWT_SECRET:PratikDairyLocalDevSecretKey_ChangeThisInProduction_MinLength32}
jwt.secret=pratikdairypratikdairypratikdairypratikdairy
# ${JWT_EXPIRATION_MS:3600000}
jwt.expiration=3600000
# 30 days - a session stays valid this long as long as it keeps getting refreshed. Revoked on
# logout, or all at once by rotating jwt.secret.
jwt.refresh-expiration=2592000000

#Eureka configuration
eureka.instance.prefer-ip-address = true

# Local development: register with Eureka under the loopback address so the gateway keeps reaching the
# services when the Wi-Fi / hotspot address changes (otherwise they stay registered under a dead address
# and every call fails with "No route to host"). On a real deployment set EUREKA_INSTANCE_IP to the
# address other services can reach this one on, or remove this line.
eureka.instance.ip-address=${EUREKA_INSTANCE_IP:127.0.0.1}
eureka.client.fetch-registry = true
eureka.client.register-with-eureka = true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# -------- Service-to-service key --------
# Calls to another service's /internal/ endpoints must carry this shared key (see
# InternalApiKeyFilter in pratik-dairy-core). It is read from the INTERNAL_API_KEY environment
# variable (or internal.api-key); the built-in default is for local development only, so set a
# long random value, identical in every service, wherever this is deployed.


# -------- Forgot password --------
# The "reset your password" email links to this address of the Angular app.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
# How long a reset link works, in minutes (it also works only once).
app.password-reset.expiry-minutes=30

# Email delivery. With NO spring.mail.host the reset link is written to this service's log instead of
# being emailed (handy locally, never for a real deployment). To send real email, set for example:
#   spring.mail.host=smtp.example.com
#   spring.mail.port=587
#   spring.mail.username=<smtp user>
#   spring.mail.password=<smtp password>      (use an environment variable, never commit it)
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true
#   app.mail.from=no-reply@pratikdairy.com

# -------- Email verification and the contact form --------
# How long the "confirm your email" link works, in hours.
app.email-verification.expiry-hours=24
# Where website contact-form messages are emailed. Leave empty to only store them (they are always shown on
# the admin Messages page).
app.contact.recipient=${APP_CONTACT_RECIPIENT:}
